<style>
:root{--bg:#FAF6F0;--paper:#FFFDF9;--alt:#F3ECE1;--ink:#1C1917;--soft:#57534E;--forest:#183126;--terra:#C85A32;--gold:#E6A12E;--bd:rgba(28,25,23,.16);--serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;overflow-x:hidden;touch-action:manipulation}
button,a,label{cursor:pointer;touch-action:manipulation}
.top,.bot{position:fixed;left:0;right:0;height:62px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);z-index:100}
.top{top:0;border-bottom:1px solid var(--bd)}.bot{bottom:0;border-top:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:none;text-align:left;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:9px;background:var(--terra);color:#fff;font-family:var(--serif);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bname{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--forest);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:42px;min-height:42px;padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--paper);color:var(--ink);font:600 13px var(--sans);white-space:nowrap}
.btn:active{transform:scale(.96)}.pri{background:var(--terra);color:#fff;border-color:var(--terra)}.fst{background:var(--forest);color:#fff;border-color:var(--forest)}
.live{width:8px;height:8px;border-radius:50%;background:#16A34A;display:inline-block}
.stage{min-height:100vh;padding:74px 14px 76px;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:1160px;background:var(--paper);border:1px solid var(--bd);border-radius:22px;box-shadow:0 12px 30px rgba(24,49,38,.12);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden}
.vis{background:var(--alt);padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--bd)}
.frame{width:100%;max-width:460px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#EFE7DA;border:2px solid rgba(24,49,38,.14);display:flex;align-items:center;justify-content:center}
.frame.sq{aspect-ratio:1/1;max-width:400px}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.vbar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;flex-wrap:wrap}
.badge{font:500 11px var(--mono);color:var(--soft);background:var(--paper);padding:4px 9px;border-radius:99px;border:1px solid var(--bd)}
.grid16{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:5px;padding:6px;background:#9E4732}
.tile{border:none;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;overflow:hidden}
.tile b{font-size:clamp(20px,3vw,30px);line-height:1;pointer-events:none}
.tile i{font:600 9px var(--mono);font-style:normal;background:rgba(255,255,255,.85);color:#1C1917;padding:1px 4px;border-radius:4px;margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.info{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 11px var(--mono);text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--alt);color:var(--forest);border:1px solid var(--bd)}
.pill.acc{background:rgba(200,90,50,.12);color:#A64421;border-color:rgba(200,90,50,.3)}
.title{font-family:var(--serif);font-size:clamp(20px,2.8vw,30px);line-height:1.18;color:var(--forest);margin-top:6px}
.client{font-size:13px;font-weight:700;color:var(--terra);margin-top:4px}
.desc{font-size:14px;color:var(--soft);margin-top:8px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sp{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
.sp small{display:block;font:600 10px var(--mono);text-transform:uppercase;color:var(--soft)}
.sp strong{font-size:12.5px;color:var(--ink)}
.roi{background:rgba(24,49,38,.06);border-left:3px solid var(--forest);padding:9px 12px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--forest);margin-top:10px}
.ctas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cnt{font:600 12px var(--mono);color:var(--forest);text-align:center}
.modal{position:fixed;inset:0;background:rgba(24,49,38,.68);display:none;align-items:center;justify-content:center;padding:14px;z-index:200}
.modal.open{display:flex}
.panel{width:100%;max-width:780px;max-height:85vh;background:var(--paper);border-radius:20px;border:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--alt);border-bottom:1px solid var(--bd)}
.mhd h2{font-family:var(--serif);font-size:18px;color:var(--forest)}
.mbd{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dcard{text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.dcard.cur{border:2px solid var(--terra);background:rgba(200,90,50,.07)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
.fld label{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--soft)}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);font:14px var(--sans);background:#fff}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;display:none;z-index:300}
.toast.show{display:block}
@media(max-width:840px){.card{grid-template-columns:1fr}.vis{border-right:none;border-bottom:1px solid var(--bd);padding:14px}}
@media(max-width:580px){.bsub,.hs{display:none}.btn{padding:7px 10px;font-size:12px}.fgrid,.specs{grid-template-columns:1fr}}
</style>
