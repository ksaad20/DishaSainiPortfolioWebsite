<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Disha Saini — Illustrator, Print &amp; Surface Designer</title>
  <meta name="description" content="Commercial illustration, surface pattern design, packaging, and textile motifs by NIFT Fashion Design graduate Disha Saini." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF6F0;
      --paper: #FFFDF9;
      --paper-alt: #F3ECE1;
      --ink: #1C1917;
      --ink-soft: #57534E;
      --forest: #183126;
      --forest-light: #244738;
      --terracotta: #C85A32;
      --terracotta-dark: #A64421;
      --marigold: #E6A12E;
      --cobalt: #1E4E8C;
      --rose: #D94E78;
      --border: rgba(28, 25, 23, 0.12);
      --shadow-sm: 0 2px 8px rgba(24, 49, 38, 0.06);
      --shadow-md: 0 12px 32px rgba(24, 49, 38, 0.12);
      --shadow-lg: 0 24px 60px rgba(24, 49, 38, 0.22);
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* App Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background:
        radial-gradient(circle at 10% 10%, rgba(230, 161, 46, 0.08), transparent 35%),
        radial-gradient(circle at 90% 90%, rgba(200, 90, 50, 0.07), transparent 40%),
        var(--bg);
    }

    /* Top Header */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(250, 246, 240, 0.94);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
      cursor: pointer;
    }

    .brand-mark {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--terracotta);
      color: #fff;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.04em;
      box-shadow: var(--shadow-sm);
    }

    .brand-text {
      min-width: 0;
      overflow: hidden;
    }

    .brand-name {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(15px, 2.2vw, 18px);
      color: var(--forest);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 44px;
      min-height: 44px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }

    .btn:hover {
      background: var(--paper-alt);
      box-shadow: var(--shadow-sm);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--terracotta);
      color: #fff;
      border-color: var(--terracotta);
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
    }

    .btn-forest {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }

    .btn-forest:hover {
      background: var(--forest-light);
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16A34A;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
    }

    /* Main Slide Stage */
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .slide-card {
      width: 100%;
      max-width: 1220px;
      min-height: min(100%, 640px);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      overflow: hidden;
      margin: auto;
      animation: fadeSlide 0.28s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0.35; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Visual Column */
    .visual-pane {
      position: relative;
      background: var(--paper-alt);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border);
      min-height: 300px;
    }

    .artwork-frame {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #EFE7DA;
      border: 2px solid rgba(24, 49, 38, 0.14);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .artwork-frame.square {
      aspect-ratio: 1 / 1;
      max-width: 440px;
    }

    .artwork-frame img.real-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .visual-toolbar {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
